<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — UserHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <section class="auth-wrapper login-bg">
    <div class="auth-card">

      <!-- Brand -->
      <div class="brand">
        <h2><i class="bi bi-box-arrow-in-right text-primary me-2"></i>Sign In</h2>
        <p>Welcome back — enter your credentials</p>
      </div>

      <!-- Alert box -->
      <div id="alert-box" class="alert" role="alert"></div>

      <!-- Login Form -->
      <form id="login-form" autocomplete="off">

        <!-- Email or Username -->
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="login-identifier"
                 placeholder="Email or Username" required>
          <label for="login-identifier"><i class="bi bi-person me-1"></i>Email or Username</label>
        </div>

        <!-- Password -->
        <div class="form-floating mb-4">
          <input type="password" class="form-control" id="login-password"
                 placeholder="Password" required>
          <label for="login-password"><i class="bi bi-lock me-1"></i>Password</label>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary w-100 py-2" id="btn-login">
          <span class="spinner-border spinner-border-sm d-none" id="login-spinner" role="status"></span>
          Sign In
        </button>
      </form>

      <!-- Link to register -->
      <div class="text-center mt-3">
        <small class="text-muted">Don't have an account?
          <a href="register.html" class="fw-semibold">Create one</a>
        </small>
      </div>

    </div>
  </section>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — UserHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Page loader -->
  <div class="page-loader" id="page-loader">
    <div class="spinner-border text-primary" style="width:3rem;height:3rem" role="status">
      <span class="visually-hidden">Loading…</span>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="navbar profile-navbar px-3">
    <a class="navbar-brand" href="#">User<span>Hub</span></a>
    <div class="d-flex align-items-center gap-3">
      <span class="text-light small" id="nav-username"></span>
      <button class="btn btn-sm btn-danger" id="btn-logout">
        <i class="bi bi-box-arrow-right me-1"></i>Logout
      </button>
    </div>
  </nav>

  <!-- Profile Content -->
  <div class="profile-wrapper">

    <!-- Header card -->
    <div class="profile-header" id="profile-header">
      <div class="profile-avatar" id="profile-avatar"></div>
      <h3 id="display-username">—</h3>
      <p id="display-email">—</p>
    </div>

    <!-- Alert box -->
    <div id="alert-box" class="alert alert-box" role="alert"></div>

    <!-- Profile Details Form -->
    <div class="profile-card">
      <h5><i class="bi bi-pencil-square me-2"></i>Profile Details</h5>

      <form id="profile-form" autocomplete="off">
        <div class="row g-3">

          <!-- Age -->
          <div class="col-md-6">
            <div class="form-floating">
              <input type="number" class="form-control" id="prof-age"
                     placeholder="Age" min="1" max="150">
              <label for="prof-age"><i class="bi bi-calendar3 me-1"></i>Age</label>
            </div>
          </div>

          <!-- Date of Birth -->
          <div class="col-md-6">
            <div class="form-floating">
              <input type="date" class="form-control" id="prof-dob" placeholder="DOB">
              <label for="prof-dob"><i class="bi bi-calendar-event me-1"></i>Date of Birth</label>
            </div>
          </div>

          <!-- Contact -->
          <div class="col-md-6">
            <div class="form-floating">
              <input type="tel" class="form-control" id="prof-contact"
                     placeholder="Contact" maxlength="15">
              <label for="prof-contact"><i class="bi bi-telephone me-1"></i>Contact Number</label>
            </div>
          </div>

          <!-- Address -->
          <div class="col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="prof-address"
                     placeholder="Address" maxlength="255">
              <label for="prof-address"><i class="bi bi-geo-alt me-1"></i>Address</label>
            </div>
          </div>

          <!-- Bio -->
          <div class="col-12">
            <div class="form-floating">
              <textarea class="form-control" id="prof-bio" placeholder="Bio"
                        style="height:100px" maxlength="500"></textarea>
              <label for="prof-bio"><i class="bi bi-chat-text me-1"></i>Bio</label>
            </div>
          </div>

        </div>

        <!-- Save button -->
        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-success px-4" id="btn-save">
            <span class="spinner-border spinner-border-sm d-none" id="save-spinner" role="status"></span>
            <i class="bi bi-check-lg me-1"></i>Save Changes
          </button>
          <button type="button" class="btn btn-outline-secondary px-4" id="btn-reset">
            <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
          </button>
        </div>
      </form>
    </div>

    <!-- Account Info (read-only) -->
    <div class="profile-card">
      <h5><i class="bi bi-shield-lock me-2"></i>Account Information</h5>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label text-muted small">User ID</label>
          <p class="fw-semibold" id="info-id">—</p>
        </div>
        <div class="col-md-4">
          <label class="form-label text-muted small">Username</label>
          <p class="fw-semibold" id="info-username">—</p>
        </div>
        <div class="col-md-4">
          <label class="form-label text-muted small">Email</label>
          <p class="fw-semibold" id="info-email">—</p>
        </div>
      </div>
    </div>

  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>

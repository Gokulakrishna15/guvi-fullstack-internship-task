<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — UserHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <section class="auth-wrapper">
    <div class="auth-card">

      <!-- Brand -->
      <div class="brand">
        <h2><i class="bi bi-person-plus-fill text-primary me-2"></i>Create Account</h2>
        <p>Join UserHub — it only takes a moment</p>
      </div>

      <!-- Alert box -->
      <div id="alert-box" class="alert" role="alert"></div>

      <!-- Registration Form (no action, no method — all via AJAX) -->
      <form id="register-form" autocomplete="off">

        <!-- Username -->
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="reg-username"
                 placeholder="Username" required minlength="3" maxlength="50">
          <label for="reg-username"><i class="bi bi-person me-1"></i>Username</label>
        </div>

        <!-- Email -->
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="reg-email"
                 placeholder="Email" required maxlength="100">
          <label for="reg-email"><i class="bi bi-envelope me-1"></i>Email address</label>
        </div>

        <!-- Password -->
        <div class="form-floating mb-1">
          <input type="password" class="form-control" id="reg-password"
                 placeholder="Password" required minlength="6">
          <label for="reg-password"><i class="bi bi-lock me-1"></i>Password</label>
        </div>
        <div class="password-strength mb-3">
          <div class="bar" id="pw-strength-bar"></div>
        </div>

        <!-- Confirm Password -->
        <div class="form-floating mb-4">
          <input type="password" class="form-control" id="reg-confirm"
                 placeholder="Confirm Password" required>
          <label for="reg-confirm"><i class="bi bi-lock-fill me-1"></i>Confirm Password</label>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary w-100 py-2" id="btn-register">
          <span class="spinner-border spinner-border-sm d-none" id="reg-spinner" role="status"></span>
          Create Account
        </button>
      </form>

      <!-- Link to login -->
      <div class="text-center mt-3">
        <small class="text-muted">Already have an account?
          <a href="login.html" class="fw-semibold">Sign In</a>
        </small>
      </div>

    </div>
  </section>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
